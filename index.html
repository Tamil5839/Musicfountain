<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drop in a song and get a choreographed night-time musical fountain show, exported as MP4." />
    <title>Fountain</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b18'/%3E%3Cpath d='M16 27V6M16 6c-3 5-7 8-10 21M16 6c3 5 7 8 10 21' stroke='%23ffd27a' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #03050b;
        --panel: rgba(12, 16, 30, 0.72);
        --line: rgba(255, 255, 255, 0.12);
        --text: #eef2ff;
        --muted: #9aa6c3;
        --accent: #ffd27a;
        --accent2: #7ee0ff;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
        font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .hidden { display: none !important; }
      .panel { background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line); border-radius: 18px; }
      .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
        padding: 36px 44px; width: min(520px, calc(100vw - 32px)); }
      h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 0.02em; font-weight: 700;
        background: linear-gradient(180deg, #fff, #ffd27a); -webkit-background-clip: text; background-clip: text; color: transparent; }
      h2 { margin: 0 0 8px; font-size: 20px; }
      .lead { font-size: 22px; margin: 6px 0; font-weight: 600; }
      .sub { color: var(--muted); margin: 0 0 22px; }
      .btn { font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
        border-radius: 10px; padding: 9px 16px; cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
      .btn:hover { background: rgba(255, 255, 255, 0.16); }
      .btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
      .btn.primary { background: linear-gradient(180deg, #ffe09a, #f2b64d); color: #1b1203; border-color: transparent; font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn.small { padding: 6px 10px; font-size: 12.5px; }
      .btn.round { width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 15px; }
      .bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin: 16px 0 10px; }
      .bar i { display: block; height: 100%; width: 0%; border-radius: 99px;
        background: linear-gradient(90deg, #7ee0ff, #ffd27a); transition: width 0.15s linear; }
      .stage { color: var(--muted); margin: 0; min-height: 1.4em; }
      #player { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px 12px;
        background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line); border-radius: 16px; }
      #player .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
      #player .meta { min-width: 0; max-width: 34vw; }
      #song-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #song-info { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #section-now { font-size: 12px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 8px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
      .spacer { flex: 1; }
      #time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
      #timeline { width: 100%; height: 92px; display: block; border-radius: 8px; background: rgba(0, 0, 0, 0.35); cursor: pointer; touch-action: none; }
      .modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); display: grid; place-items: center; }
      .modal .panel { width: min(560px, calc(100vw - 32px)); padding: 24px; }
      .modal .summary { color: var(--muted); margin: 0; }
      .modal .result { display: grid; gap: 12px; margin-top: 12px; }
      .modal video { width: 100%; max-height: 42vh; border-radius: 10px; background: #000; }
      .modal .note { color: #ffcf8a; font-size: 12.5px; margin: 0; }
      .modal .actions { display: flex; justify-content: flex-end; margin-top: 14px; gap: 8px; }
      #toast { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; transition: all 0.25s;
        max-width: calc(100vw - 32px); backdrop-filter: blur(14px); }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast.error { border-color: rgba(255, 90, 90, 0.6); }
      #drag-hint { position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 20px; display: none;
        place-items: center; font-size: 28px; font-weight: 600; background: rgba(0, 0, 0, 0.35); pointer-events: none; }
      body.dragging #drag-hint { display: grid; }
      body.ui-hidden #player, body.ui-hidden #toast { opacity: 0; pointer-events: none; }
      body.ui-hidden #player:hover { opacity: 1; pointer-events: auto; }
      .lil-gui.root { position: fixed; top: 12px; right: 12px; --background-color: rgba(12, 16, 30, 0.82);
        --widget-color: rgba(255, 255, 255, 0.1); --title-background-color: rgba(20, 26, 48, 0.9); border-radius: 12px; overflow: hidden; }
      #fatal { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
      @media (max-width: 720px) {
        #player .meta, #section-now, #clip-start, #clip-end { display: none; }
        .lil-gui.root { top: auto; bottom: 150px; max-height: 45vh; }
        h1 { font-size: 34px; }
        .center { padding: 26px 20px; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
